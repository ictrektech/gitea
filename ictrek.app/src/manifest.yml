id: com.ictrek.gitea
name:
  zh-CN: Gitea
  en: Gitea
description:
  zh-CN: 轻量代码托管、仓库管理、代码评审与 API，使用 VOS 账户登录并同步身份和语言。
  en: Lightweight Git hosting, repositories, code review and APIs with VOS identity and language synchronization.
version: __APP_VERSION__
author: ictrek
category: [productivity]
icon: icon.png
arch: [amd64, arm64]
frontend:
  enabled: true
  basePath: /app/com.ictrek.gitea
platform:
  version: ">=3.0.0"
dependencies:
  apps:
    - id: com.ictrek.pgv
      version: latest
      optional: false
profiles:
  - name: amd
    title:
      zh-CN: AMD64（x86-64）
      en: AMD64 (x86-64)
    description:
      zh-CN: AMD64 / x86_64 平台，无需 GPU。
      en: AMD64 / x86_64 platform, no GPU required.
    caps:
      arch: amd64
    conflicts: [arm]
  - name: arm
    title:
      zh-CN: ARM64（64 位 ARM）
      en: ARM64 (64-bit ARM)
    description:
      zh-CN: ARM64 平台，适用于 L4T、Thor 和 Spark，无需 GPU。
      en: ARM64 platform for L4T, Thor and Spark, no GPU required.
    caps:
      arch: arm64
    conflicts: [amd]
require-profiles: true
storage:
  directories:
    - path: config
      mode: "0700"
oauth2:
  client: {}
